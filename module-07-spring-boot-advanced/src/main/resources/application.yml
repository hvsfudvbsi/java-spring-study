spring:
  application:
    name: module-07-spring-boot-advanced

  # ---------------- Caffeine 本地缓存配置 ----------------
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m
    # cache-names: 预声明缓存名（不声明也可以，首次使用自动创建）

server:
  port: 8080

# ---------------- Actuator 监控端点 ----------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.study.advanced: info
