# ==================== 内嵌 Tomcat（HTTP/REST） ====================
server.port=8080

# Tomcat NIO 连接器调优示例（Tomcat 用的是它自己的 Java NIO 实现，不是 Netty）
# server.tomcat.threads.max=200
# server.tomcat.threads.min-spare=10
# server.tomcat.accept-count=100
# server.tomcat.max-connections=10000

# ==================== 同 JVM 内嵌的 Netty TCP 服务 ====================
# 0 表示随机端口（测试用）
netty.server.port=19090
# Netty worker 线程数（IO 线程，与 Tomcat 线程池相互独立）
netty.server.workers=4
