spring:
  application:
    name: module-05-spring-security

server:
  port: 8080

# ---------------- JWT 配置 ----------------
jwt:
  # 密钥（HS256 要求至少 32 字节）。生产环境务必用环境变量注入，不要写死在代码/配置里！
  # 示例：jwt.secret=${JWT_SECRET}
  secret: java-spring-study-secret-key-please-change-in-production-2026!
  # token 有效期（毫秒）：默认 1 小时
  expiration-ms: 3600000

# ---------------- 演示用户（BCrypt 加密后的密码） ----------------
# admin / admin123  -> 角色 ROLE_ADMIN, ROLE_USER
# user  / user123   -> 角色 ROLE_USER
