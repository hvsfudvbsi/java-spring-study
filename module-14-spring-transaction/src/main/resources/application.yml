spring:
  application:
    name: module-14-spring-transaction

  datasource:
    url: jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    org.springframework.jdbc.datasource: DEBUG
    org.springframework.transaction: TRACE
