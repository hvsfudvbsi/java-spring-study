# ==================== 主配置（所有 Profile 共享） ====================
app:
  name: java-spring-study
  version: 1.0.0
  author: zhangsan
  tags:
    - spring
    - java
    - boot
  limits:
    max-users: 1000
    max-connections: 100
  feature:
    hello-enabled: true

server:
  port: 8080

# ==================== 日志级别示例 ====================
logging:
  level:
    root: info
    com.study.bootbasics: debug

