# ==================== dev（开发环境）Profile ====================
# 激活方式：--spring.profiles.active=dev
# 或设置环境变量 SPRING_PROFILES_ACTIVE=dev
# Profile 中配置的值会覆盖 application.yml 中的同名配置

server:
  port: 8080

app:
  name: java-spring-study (dev)
  author: zhangsan-dev

logging:
  level:
    com.study.bootbasics: debug   # 开发环境输出更详细的日志

# ==================== 其他 Profile 示例 ====================
# application-prod.yml 生产环境：通常关闭调试日志、开启更多监控
# application-test.yml 测试环境：通常连接测试数据库
# 最佳实践：公共配置放 application.yml，环境差异配置放各自的 Profile 文件
