spring:
  application:
    name: module-04-spring-data-jpa

  # ---------------- H2 内存数据库配置 ----------------
  datasource:
    url: jdbc:h2:mem:studydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ---------------- JPA 配置 ----------------
  jpa:
    # 启动时根据实体自动建表（学习阶段用 create，生产用 validate 或 Flyway 迁移）
    hibernate:
      ddl-auto: create-drop
    # 开发时打印 SQL 方便学习
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ---------------- H2 控制台（浏览器访问 http://localhost:8080/h2-console） ----------------
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
