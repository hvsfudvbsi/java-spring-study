server:
  port: 8082

spring:
  application:
    name: order-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Feign 配置
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
