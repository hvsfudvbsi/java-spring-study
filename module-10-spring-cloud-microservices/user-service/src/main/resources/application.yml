server:
  port: 8081

spring:
  application:
    # 服务名：注册到 Eureka 的名字，其他服务通过这个名字调用（Feign name 对应）
    name: user-service

eureka:
  client:
    service-url:
      # 注册中心地址（Eureka Server 的默认 zone）
      defaultZone: http://localhost:8761/eureka/
  instance:
    # 注册时上报的实例 id（默认是 hostname:appname:port）
    prefer-ip-address: true
