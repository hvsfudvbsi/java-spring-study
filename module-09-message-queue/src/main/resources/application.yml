spring:
  application:
    name: module-09-message-queue

  # ==================== Kafka 配置 ====================
  kafka:
    # 无 Kafka 环境时：
    #   - 测试使用 spring-kafka-test 的内嵌 broker（自动覆盖此配置）
    #   - 主应用运行需可访问的 broker，可用 Docker：docker run -p 9092:9092 apache/kafka
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: study-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # ==================== RabbitMQ 配置（默认关闭，配置好环境后启用） ====================
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 生产级可靠性配置（进阶）：
    # publisher-confirm-type: correlated   # 发送确认
    # publisher-returns: true              # 消息路由失败回调
    # listener:
    #   simple:
    #     acknowledge-mode: manual         # 手动确认
    #     retry:
    #       enabled: true
    #       max-attempts: 3

server:
  port: 8080

# ==================== 模块开关 ====================
mq:
  kafka:
    # Kafka 开箱即用（默认开启）
    enabled: true
  rabbit:
    # RabbitMQ 默认关闭：保留完整代码与配置，后续配好环境（安装/启动 RabbitMQ）后改为 true
    enabled: false

logging:
  level:
    com.study.mq: info
